<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Sheet Music</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }

        canvas {
            display: block;
            margin: 0 auto 20px;
            border: 1px solid #ccc;
            background: white;
        }
		#pdf-container { position: absolute; left:405px; top:0px; }
		#toc { position: absolute; left:0px; top:0px; width:380px; padding: 10px; }
		.lnk { color: blue; cursor: pointer; }
		.lnk:hover { color: red; }
		.simsun { font-family: simsun; }
		li   { line-height: 18pt; }
    </style>
</head>

<script type="module">	// some elements in pdf.js requires type="module"
	import * as pdfjsLib from
		"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs";

	pdfjsLib.GlobalWorkerOptions.workerSrc =
	  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs";
	
    async function loadPdf(pdfUrl) {
		document.getElementById("pdf-container").innerHTML = '';
		const pdf = await pdfjsLib.getDocument("pdf/"+pdfUrl).promise;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);

            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            document.getElementById("pdf-container").appendChild(canvas);

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;
        }
    } 

	window.loadPdf = loadPdf;	// because this script is in a module, this line exports the loadPdf() function
	window.onload = main;
	
	function main() {
		const pdfUrl = "sdd-violin.pdf";
		loadPdf(pdfUrl).catch(console.error);
	}
</script>

<body oncontextmenu="return false;">
<div id="pdf-container"></div>
<div id="toc">
<h2 style="font-family:arial; text-align:center; text-shadow:1px 1px 5px #808080; margin-top:10pt;">MY SHEET MUSIC</h2>
<ol>
	<li><span class="lnk" onclick="loadPdf('Bach_Air_On_The_G_String.pdf')">Bach: Air on the G String</span></li>
	<li><span class="lnk" onclick="loadPdf('Beethoven_Minuet_in_G.pdf')">Beethoven: Minuet in G</span></li>
    <li><span class="lnk" onclick="loadPdf('Clair_de_Lune_for_Violin.pdf')">Debussy: Clair de Lune for Violin</span></li>
    <li><span class="lnk" onclick="loadPdf('Ave_Maria.pdf')">Gounod: Ave Maria</span></li>
    <li><span class="lnk" onclick="loadPdf('Mozart_Minuet_in_D.pdf')">Mozart: Minuet in D</span></li>
    <li><span class="lnk" onclick="loadPdf('LE_CYGNE.pdf')">Saint-Saens: Le Cygne</span></li>
    <li><span class="lnk" onclick="loadPdf('schindler.pdf')">Williams: Theme from the Schindler's List</span></li>
    <li><span class="lnk simsun" onclick="loadPdf('sdd-violin.pdf')">陕北民歌：山丹丹开花红艳艳</span></li>
</ol>
</div>
</body>
</html>
