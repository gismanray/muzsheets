<html>
<head>
  <title>Sheet Music Repository</title>
  <style type="text/css">
    body { font-family: Times New Roman; }
    li   { line-height: 18pt; }
    a    { color: blue; text-decoration: none; }
    a:hover { color: red; }
    .simsun {font-family: simsun; }
    .toc  { position:absolute; left:0px; top:0px; width:380px; height:100%; padding:10px; overflow-x:hidden; overflow-y:auto; }
    .sht { position:absolute; left: 405px; top:0px; width:900px; height:100%; }
    span { color: blue; cursor: pointer; }
    span:hover { color:red; }
  </style>
  <script>
    function show(file) {
      document.getElementById('pdf').data = "pdf/"+file+"#toolbar=0&navpanes=0&scrollbar=0";
    }
  </script>
</head>
<body oncontextmenu="return false;">
  <div class="toc">
  <h1 style="font-family:arial; width:400px; text-align:center;">My Sheet Music</h1>
  <ol>
    <li><span onclick="show('Bach_Air_On_The_G_String.pdf')">Bach: Air on the G String</span></li>
    <li><span onclick="show('Beethoven_Minuet_in_G.pdf')">Beethoven: Minuet in G</span></li>
    <li><span onclick="show('Clair_de_Lune_for_Violin.pdf')">Debussy: Clair de Lune for Violin</span></li>
    <li><span onclick="show('Ave_Maria.pdf')">Gounod: Ave Maria</span></li>
    <li><span onclick="show('Mozart_Minuet_in_D.pdf')">Mozart: Minuet in D</span></li>
    <li><span onclick="show('schindler.pdf')">Williams: Theme from the Schindler's List</span></li>
    <li><span onclick="show('LE_CYGNE.pdf')">Saint-Saens: Le Cygne</span></li>
    <li><span onclick="show('sdd-violin.pdf')" class="simsun">陕北民歌：山丹丹开花红艳艳</span></li>
  </ol>
  </div>
  <div class="sht" oncontextmenu="return false;">
    <object id="pdf" type="application/pdf" data="pdf/sdd-violin.pdf#toolbar=0&navpanes=0&scrollbar=0"></object>
  </div>
</body>
</html>
